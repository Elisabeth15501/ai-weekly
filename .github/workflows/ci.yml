name: CI

# 把仓库已有质量门禁（13 个纯函数单测 + 全仓语法编译）接进自动化：
# 每次 push / PR 都跑，避免坏提交直接进入公开仓库或 SkillHub 发行。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt
      - name: Diagnostic (env sanity)
        run: |
          python --version
          python -m pytest --version
          pip list | grep -iE "pytest|beautifulsoup4|feedparser|requests" || true
      - name: Syntax gate (py_compile all scripts)
        run: python -m compileall -q scripts
      # 84 个纯函数单测 + 11 个 XSS/合规门禁单测。
      # test_p1_guards.py 此前游离在 CI 之外（只跑 aiweekly/tests/），门禁回归会静默溜过，
      # 故一并纳入；它只依赖同目录模块，纯离线，可在 ubuntu 上直接跑。
      - name: Unit tests (pure, offline) + P1 guard tests
        working-directory: scripts
        run: python -m pytest aiweekly/tests/ test_p1_guards.py -q --tb=short

      # 发布前合规门禁：词表检查，命中 BLOCKER 即退出码 1，让 CI 变红。
      # 此前全仓无任何地方调用它，等于门禁只存在于开发者记忆里。
      # 该脚本被 .clawhubignore 排除、不随包分发，因此在 CI 中运行不影响发布产物。
      - name: Compliance gate (pre-publish wording check)
        working-directory: scripts
        run: python compliance_check.py

      # 端到端质量门禁：用确定性 fixture（离线）生成报告，再跑 24/24 校验。
      # 任何生成/校验回归都会让 CI 变红——这是把"手动看周报挑刺"自动化。
      - name: Build sample report & validate (24/24 gate)
        working-directory: scripts
        run: |
          python generate_site.py \
            --api-json aiweekly/tests/fixtures/sample_news.json \
            --insights-json aiweekly/tests/fixtures/sample_insights.json \
            --ranking-json aiweekly/tests/fixtures/sample_ranking.json \
            --no-live-ranking --no-translate-en --output report_ci.html
          python validate_report.py --html report_ci.html
