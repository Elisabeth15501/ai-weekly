name: Mirror Leaderboard & Weekly Report

# L3#20 + L3#21：每天抓取国际榜源构建排行榜镜像，并生成 AI 周报站，
# 一并发布到 GitHub Pages：既作为在线 demo，也作为「往周数据源」（结构化 JSON）。
# 国内用户改用 Pages 地址拉取，免去代理。
on:
  schedule:
    - cron: '17 18 * * *'      # 每天 UTC 18:17 ≈ 北京 02:17
  workflow_dispatch:
    inputs:
      week:
        description: '指定 ISO 周（如 2026-W33）覆盖本周；留空=本周。注意 RSS 仅保留约 1 周'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mirror-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Build Pages site (leaderboard mirror + weekly report + data source)
        run: |
          ARGS=(--out-dir public)
          if [ -n "${{ github.event.inputs.week }}" ]; then
            ARGS+=(--week "${{ github.event.inputs.week }}")
          fi
          python scripts/build_pages_site.py "${ARGS[@]}"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
